name: Windows Autobuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an automatic prerelease (main branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-autobuild-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install CMake 4
        run: |
          python -m pip install --disable-pip-version-check cmake==4.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          ninja --version

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          setup-python: false
          cache: true

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Set build number
        id: version
        run: |
          $buildNumber = (git rev-parse HEAD).Substring(0, 7)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          $versionFile = Join-Path $env:GITHUB_WORKSPACE 'src/VERSION.h'
          $version = [System.IO.File]::ReadAllText($versionFile)
          if (-not $version.Contains('|BUILD_VERSION|')) {
            throw 'The build version placeholder is missing from src/VERSION.h.'
          }
          [System.IO.File]::WriteAllText($versionFile, $version.Replace('|BUILD_VERSION|', $buildNumber), [System.Text.UTF8Encoding]::new($false))

      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage application and Qt dependencies
        run: |
          New-Item -ItemType Directory -Path out/setupBuild -Force | Out-Null
          Copy-Item build/ClassTopLand-Next.exe, build/ElaWidgetTools.dll out/setupBuild/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --force --no-quick-import --no-translations out/setupBuild/ClassTopLand-Next.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('ClassTopLand-Next.exe', 'ElaWidgetTools.dll', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Qml.dll', 'Qt6Network.dll', 'platforms/qwindows.dll', 'tls/qschannelbackend.dll', 'vc_redist.x64.exe')) {
            if (-not (Test-Path "out/setupBuild/$file" -PathType Leaf)) {
              throw "Deployment is missing $file"
            }
          }

      - name: Build installer with Inno Setup
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc -PathType Leaf)) { throw 'Inno Setup 6 is missing from the runner.' }
          & $iscc "/DBuildNumber=$env:BUILD_NUMBER" "/DAppSourceDir=$env:GITHUB_WORKSPACE/out/setupBuild" "/DAppOutputDir=$env:GITHUB_WORKSPACE/out/setupExe" "/DRepositoryDir=$env:GITHUB_WORKSPACE" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClassTopLand-Next-windows-x64-${{ steps.version.outputs.build_number }}
          path: out/setupExe/ClassTopLand-Next-setup_build_${{ steps.version.outputs.build_number }}-amd64.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish automatic prerelease
    needs: build
    if: >-
      github.repository == 'Aero8m/ClassTopLand-Next' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-autobuild-release-${{ needs.build.outputs.build_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}

    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClassTopLand-Next-windows-x64-${{ needs.build.outputs.build_number }}
          path: out/setupExe

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$BUILD_NUMBER"; then
            tag_commit="$(git rev-list -n 1 "refs/tags/$BUILD_NUMBER")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "The existing tag points to a different commit: $tag_commit" >&2
              exit 1
            fi
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '## 更新日志\n\n'
            git log -1 --format=%B | sed '/^[[:space:]]*$/d; s/^/- /'
            printf '\n本 Release 为自动构建版本，可能会有不稳定现象。\n\n提交：%s\n' "$GITHUB_SHA"
          } > "$notes_file"
          installer="out/setupExe/ClassTopLand-Next-setup_build_${BUILD_NUMBER}-amd64.exe"
          if gh release view "$BUILD_NUMBER" > /dev/null 2>&1; then
            gh release upload "$BUILD_NUMBER" "$installer" --clobber
          else
            gh release create "$BUILD_NUMBER" "$installer" --target "$GITHUB_SHA" \
              --title "build $BUILD_NUMBER" --notes-file "$notes_file" --prerelease --latest=false
          fi

  mirror:
    name: Upload installer to OpenList
    needs: [build, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: windows-autobuild-openlist-${{ needs.build.outputs.build_number }}
      cancel-in-progress: false
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}

    steps:
      - name: Download installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClassTopLand-Next-windows-x64-${{ needs.build.outputs.build_number }}
          path: out/setupExe

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rclone
          rclone version

      - name: Upload and verify installer
        shell: bash
        env:
          RCLONE_CONFIG: /dev/null
          RCLONE_CONFIG_OPENLIST_TYPE: webdav
          RCLONE_CONFIG_OPENLIST_URL: https://autobuild.aero8m.cn/dav/
          RCLONE_CONFIG_OPENLIST_VENDOR: other
          RCLONE_CONFIG_OPENLIST_USER: ${{ secrets.OPENLIST_USERNAME }}
          OPENLIST_PASSWORD: ${{ secrets.OPENLIST_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RCLONE_CONFIG_OPENLIST_USER" || -z "$OPENLIST_PASSWORD" ]]; then
            echo 'OPENLIST_USERNAME and OPENLIST_PASSWORD must be configured in Actions secrets.' >&2
            exit 1
          fi
          installer_name="ClassTopLand-Next-setup_build_${BUILD_NUMBER}-amd64.exe"
          if [[ ! -f "out/setupExe/$installer_name" ]]; then
            echo "Installer not found: $installer_name" >&2
            exit 1
          fi
          obscured_password="$(printf '%s\n' "$OPENLIST_PASSWORD" | rclone obscure -)"
          printf '::add-mask::%s\n' "$obscured_password"
          export RCLONE_CONFIG_OPENLIST_PASS="$obscured_password"
          unset OPENLIST_PASSWORD obscured_password
          rclone copy out/setupExe openlist:ClassTopLand-Next \
            --include "$installer_name" --ignore-times --transfers 1 \
            --retries 3 --low-level-retries 10 --contimeout 30s --timeout 5m
          rclone check out/setupExe openlist:ClassTopLand-Next \
            --include "$installer_name" --one-way --download \
            --contimeout 30s --timeout 5m
